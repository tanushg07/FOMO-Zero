[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fomo-zero"
version = "0.1.0"
description = "FOMO-Zero notice extraction persistence layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "PyMuPDF>=1.24,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["fomo_zero*"]
